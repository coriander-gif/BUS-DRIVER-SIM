<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BUS DRIVER SIM</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{position:absolute;pointer-events:auto}
#speed{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none;background:rgba(15,20,28,.55);border-radius:14px;padding:8px 16px;text-align:center;min-width:110px}
#speed b{font-size:44px;font-variant-numeric:tabular-nums;line-height:1}#speed small{display:block;font-size:12px;opacity:.8}
#mode{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:none;background:rgba(15,20,28,.55);border-radius:20px;padding:5px 16px;font-size:13px;letter-spacing:.1em}
#sw{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px;flex-wrap:wrap;max-width:46vw}
#sw button{font-size:12px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.5);background:rgba(15,20,28,.55);color:#fff;touch-action:manipulation}
#sw button.on{background:rgba(255,180,30,.85);color:#000}
#dpad{--k:clamp(64px,13vmin,100px);right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(3,var(--k));gap:6px}
.k{border-radius:18px;border:2px solid rgba(255,255,255,.55);background:rgba(15,20,28,.5);color:#fff;font-size:calc(var(--k)*.38);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;line-height:1}
.k small{font-size:calc(var(--k)*.15);margin-top:3px}.k.on{background:rgba(255,180,30,.85);color:#000;border-color:#fff}
#title{position:fixed;inset:0;background:linear-gradient(#1c4a7a,#6fb0e0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9}
#title h1{font-size:clamp(34px,9vw,80px);margin:0;letter-spacing:.08em;text-shadow:0 4px 12px rgba(0,0,0,.4)}
#title p{opacity:.9;margin:8px 20px;line-height:1.6}
#start{margin-top:22px;font-size:26px;padding:14px 54px;border-radius:40px;border:3px solid #fff;background:#e8a317;color:#111;font-weight:700;touch-action:manipulation}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" hidden>
 <div id="mode">フリー走行</div>
 <div id="sw">
  <button data-s="left">◀ ウインカー</button><button data-s="right">ウインカー ▶</button>
  <button data-s="light">ライト</button><button data-s="wiper">ワイパー</button>
  <button data-s="doorF">前扉</button><button data-s="doorM">中扉</button>
 </div>
 <div id="speed"><b id="spd">0</b><small>km/h　<span id="gear">N</span></small></div>
 <div id="dpad">
  <div></div><div class="k" data-k="accel">▲<small>アクセル</small></div><div></div>
  <div class="k" data-k="left">◀<small>左</small></div><div></div><div class="k" data-k="right">▶<small>右</small></div>
  <div></div><div class="k" data-k="brake">▼<small>ブレーキ</small></div><div></div>
 </div>
</div>
<div id="title">
 <h1>BUS DRIVER SIM</h1>
 <p>日本風の街を走る 3Dバス運転シミュレーター　v0.1</p>
 <p>右下の十字キー：▲アクセル　▼ブレーキ（停止中に押し続けるとバック）　◀▶ハンドル<br>PCは 矢印キー / WASD も使えます</p>
 <button id="start">START</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ===== 入力（UIと分離）: Controls が唯一の入力状態 ===== */
const Controls={accel:0,brake:0,left:0,right:0};
const Sw={left:0,right:0,light:0,wiper:0,doorF:0,doorM:0}; // 将来機能追加用のスイッチ状態
(function(){
  const ptr=new Map(),keys=new Set(),btns=[...document.querySelectorAll('.k')];
  const KM={ArrowUp:'accel',KeyW:'accel',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
  function refresh(){const c={accel:0,brake:0,left:0,right:0};ptr.forEach(k=>c[k]=1);keys.forEach(k=>c[k]=1);Object.assign(Controls,c);btns.forEach(b=>b.classList.toggle('on',!!c[b.dataset.k]))}
  btns.forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,b.dataset.k);refresh()});
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  const rel=e=>{if(ptr.delete(e.pointerId))refresh()};
  addEventListener('pointerup',rel,true);addEventListener('pointercancel',rel,true);
  const clear=()=>{ptr.clear();keys.clear();refresh()};
  addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);addEventListener('touchend',e=>{if(!e.touches.length)clear()});
  addEventListener('keydown',e=>{if(KM[e.code]){keys.add(KM[e.code]);refresh();e.preventDefault()}});
  addEventListener('keyup',e=>{if(KM[e.code]){keys.delete(KM[e.code]);refresh()}});
  document.querySelectorAll('#sw button').forEach(b=>b.addEventListener('pointerdown',e=>{
    e.preventDefault();const s=b.dataset.s;Sw[s]^=1;
    if(s==='left'&&Sw.left)Sw.right=0;if(s==='right'&&Sw.right)Sw.left=0;
    document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',!!Sw[x.dataset.s]));
  }));
})();

/* ===== レンダラ・シーン ===== */
const S=70,W=12,N=7,MAXC=(N-1)*S;
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio||1,1.5),PRmax=PR;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfdcf2);scene.fog=new THREE.Fog(0xbfdcf2,45,180);
const camera=new THREE.PerspectiveCamera(66,1,0.1,200);scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a9a78,0.95));
const sun=new THREE.DirectionalLight(0xfff4e0,0.7);sun.position.set(100,200,60);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(PR);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ===== ヘルパ ===== */
const L=c=>new THREE.MeshLambertMaterial({color:c});
const B=new THREE.BoxGeometry(1,1,1),dm=new THREE.Object3D();
function inst(geo,mat,items){const m=new THREE.InstancedMesh(geo,mat,items.length);
  items.forEach((a,i)=>{dm.position.set(a[0],a[1],a[2]);dm.scale.set(a[3],a[4],a[5]);dm.rotation.set(0,a[6]||0,0);dm.updateMatrix();m.setMatrixAt(i,dm.matrix)});
  m.frustumCulled=false;scene.add(m);return m}
let seed=12345;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ===== 街（固定道路網 7x7 グリッド） ===== */
const obstacles=[]; // 建物AABB [x0,x1,z0,z1]
(function buildCity(){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),L(0x7d9a6b));g.rotation.x=-Math.PI/2;g.position.set(MAXC/2,-0.03,MAXC/2);scene.add(g);
  const len=MAXC+W,mid=MAXC/2,roads=[],white=[],slabs=[],park=[],trunk=[],crown=[],poles=[],heads=[],lEW=[],lNS=[];
  for(let i=0;i<N;i++){roads.push([i*S,0,mid,W,.04,len]);roads.push([mid,.001,i*S,len,.04,W])}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const cx=i*S,cz=j*S;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dz])=>{
      if(i+dx<0||i+dx>=N||j+dz<0||j+dz>=N)return;
      const bx=cx+dx*(W/2+2.5),bz=cz+dz*(W/2+2.5),px=Math.abs(dz),pz=Math.abs(dx);
      for(let k=-4;k<=4;k++)white.push([bx+px*k*1.3,.035,bz+pz*k*1.3,dx?3:.6,.02,dx?.6:3]);
      const sx=cx+dx*(W/2+4.8)-dz*W/4,sz=cz+dz*(W/2+4.8)+dx*W/4;
      white.push([sx,.035,sz,dx?.45:5.5,.02,dx?5.5:.45]);
    });
    [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz])=>{
      const x=cx+sx*(W/2+.6),z=cz+sz*(W/2+.6);poles.push([x,2.6,z,.15,5.2,.15]);heads.push([x,5.2,z,.5,1.2,.5]);
      lEW.push([x+sx*.28,5.2,z,.1,.4,.4]);lNS.push([x,5.2,z+sz*.28,.4,.4,.1]);
    });
  }
  for(let a=0;a<N;a++)for(let s=0;s<N-1;s++){
    const c=s*S+S/2;
    for(let k=-2;k<=2;k++){white.push([a*S,.035,c+k*9,.18,.02,3]);white.push([c+k*9,.035,a*S,3,.02,.18])}
    [-1,1].forEach(e=>{white.push([a*S+e*(W/2-.5),.035,c,.15,.02,46]);white.push([c,.035,a*S+e*(W/2-.5),46,.02,.15]);
      [20,50].forEach(o=>{poles.push([a*S+e*(W/2+.9),3.5,s*S+(e>0?o:S-o),.2,7,.2]);poles.push([s*S+(e>0?o:S-o),3.5,a*S+e*(W/2+.9),.2,7,.2])})});
  }
  // 建物ブロック
  const tex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#e8e6df';x.fillRect(0,0,64,64);x.fillStyle='#4f6b85';x.fillRect(8,10,48,36);x.fillStyle='#8fb0cc';x.fillRect(8,10,48,8);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
  const bm=[0xffffff,0xf0e0c8,0xd8e4f0,0xe8d0d0,0xd0e8d8,0xc8c8d0].map(c=>new THREE.MeshLambertMaterial({color:c,map:tex}));
  function building(x,z,w,d,h,mat){
    const geo=new THREE.BoxGeometry(w,h,d),uv=geo.attributes.uv;
    for(let f=0;f<6;f++){const a=f<2?d:w,b=f<2?h:(f<4?d:h);
      for(let v=0;v<4;v++){const k=f*4+v;if(f===2||f===3)uv.setXY(k,0,0);else uv.setXY(k,uv.getX(k)*a/4,uv.getY(k)*b/3.6)}}
    const m=new THREE.Mesh(geo,mat);m.position.set(x,h/2+.15,z);scene.add(m);
    obstacles.push([x-w/2,x+w/2,z-d/2,z+d/2]);
  }
  for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++){
    const bx=i*S+S/2,bz=j*S+S/2;slabs.push([bx,.075,bz,S-W,.15,S-W]);
    for(const a of[-1,1])for(const b of[-1,1]){
      const lx=bx+a*15,lz=bz+b*15;
      if(rnd()<.12){park.push([lx,.2,lz,24,.1,24]);for(let t=0;t<3;t++){const tx=lx+(rnd()-.5)*16,tz=lz+(rnd()-.5)*16;trunk.push([tx,1.2,tz,.4,2.4,.4]);crown.push([tx,3.6,tz,3.2,3.2,3.2])}}
      else building(lx,lz,18+rnd()*8,18+rnd()*8,8+rnd()*(rnd()<.25?34:14),bm[(rnd()*bm.length)|0]);
    }
  }
  inst(B,L(0x4a4d52),roads);inst(B,L(0xf2f2f2),white);inst(B,L(0xb9b9b4),slabs);inst(B,L(0x6f9a58),park);
  inst(B,L(0x5a4030),trunk);inst(new THREE.SphereGeometry(.5,6,5),L(0x3f7d3a),crown);
  inst(B,L(0x6b5a48),poles);inst(B,L(0x2a2a2a),heads);
  window.sigEW=new THREE.MeshBasicMaterial({color:0x22dd55});window.sigNS=new THREE.MeshBasicMaterial({color:0xdd2222});
  inst(B,sigEW,lEW);inst(B,sigNS,lNS);
  // バス停（3か所）
  const post=L(0xeeeeee),sign=L(0x1d5fb4),roof=L(0x4a6a8a);
  [[S-W/2-1.4,130],[S-W/2-1.4,270],[3*S-W/2-1.4,190]].forEach(([x,z])=>{
    const p=new THREE.Mesh(B,post);p.scale.set(.1,3.2,.1);p.position.set(x,1.75,z);scene.add(p);
    const s=new THREE.Mesh(B,sign);s.scale.set(.6,.6,.1);s.position.set(x,3.4,z);s.rotation.y=Math.PI/2;scene.add(s);
    const r=new THREE.Mesh(B,roof);r.scale.set(1.4,.1,4);r.position.set(x-1.2,2.6,z);scene.add(r);
    const bk=new THREE.Mesh(B,roof);bk.scale.set(.08,2.3,4);bk.position.set(x-1.8,1.4,z);scene.add(bk);
  });
})();

/* ===== 一般車（少数・一定速度で直進周回） ===== */
const cars=[];
(function(){
  const bg=new THREE.BoxGeometry(1.7,1,4),cg=new THREE.BoxGeometry(1.5,.7,2),cm=L(0x223344);
  const cols=[0xcc3333,0xeeeeee,0x2d5fa8,0xe0c030,0x333333,0x3b8b4a].map(L);
  [['z',1,1,20,9],['z',3,-1,300,8],['x',2,1,50,9],['x',4,-1,350,8],['z',5,1,150,9],['x',1,-1,200,8]].forEach(([ax,idx,d,p,v],n)=>{
    const m=new THREE.Group(),b=new THREE.Mesh(bg,cols[n]);b.position.y=.9;const c=new THREE.Mesh(cg,cm);c.position.set(0,1.7,.2);m.add(b,c);scene.add(m);
    cars.push({m,ax,c:idx*S,d,p,v,x:0,z:0});
  });
})();
function updateCars(dt){cars.forEach(c=>{
  c.p+=c.d*c.v*dt;if(c.p>MAXC+W/2)c.p=-W/2;if(c.p<-W/2)c.p=MAXC+W/2;
  const dx=c.ax==='x'?c.d:0,dz=c.ax==='z'?c.d:0;
  c.x=c.ax==='z'?c.c+dz*(W/4):c.p;c.z=c.ax==='z'?c.p:c.c-dx*(W/4); // 左側通行
  c.m.position.set(c.x,0,c.z);c.m.rotation.y=Math.atan2(-dx,-dz)});}

/* ===== バス車体（ミラーに映る外観） ===== */
const busG=new THREE.Group();scene.add(busG);
(function(){
  const add=(c,sx,sy,sz,x,y,z)=>{const m=new THREE.Mesh(B,L(c));m.scale.set(sx,sy,sz);m.position.set(x,y,z);busG.add(m)};
  add(0xf4f4f0,2.5,2.7,10.6,0,1.75,0);add(0x1f7a4d,2.52,.4,10.62,0,1.0,0);add(0x1f7a4d,2.52,.2,10.62,0,3.0,0);
  add(0x1a2530,2.53,.95,9.4,0,2.3,-.2);add(0xdddddd,1.4,.3,2.2,0,3.25,1);
  // フロントガラス: 外向き(-z)の半透明プレーン。室内側からは背面カリングで完全に透過し、外(ミラー等)からは暗いガラスに見える
  const ws=new THREE.Mesh(new THREE.PlaneGeometry(2.1,1.1),new THREE.MeshBasicMaterial({color:0x1a2530,transparent:true,opacity:.55,depthWrite:false,side:THREE.FrontSide}));
  ws.position.set(0,2.25,-5.31);ws.rotation.y=Math.PI;ws.renderOrder=1;busG.add(ws);
  const wg=new THREE.CylinderGeometry(.5,.5,.3,12),wm=L(0x111111);
  [[-1.15,-3.4],[1.15,-3.4],[-1.15,2.6],[1.15,2.6]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.5,z);busG.add(w)});
  add(0x222222,.12,.5,.08,-1.45,2.1,-4.7);add(0x222222,.12,.5,.08,1.45,2.1,-4.7);
})();

/* ===== コックピット（カメラに固定） ===== */
const DRV=new THREE.Vector3(.65,2.15,-4.3);
busG.add(camera);camera.position.copy(DRV);
const cockpit=new THREE.Group();camera.add(cockpit);
const wheelSpin=new THREE.Group(),wipers=[],lamps={};
const mirrors=[];
(function(){
  const add=(c,sx,sy,sz,x,y,z,p=cockpit)=>{const m=new THREE.Mesh(B,L(c));m.scale.set(sx,sy,sz);m.position.set(x,y,z);p.add(m);return m};
  add(0x20252b,3.2,.4,.6,0,-.55,-1);add(0x15181c,3.2,.5,.3,0,-.8,-.6);
  add(0x1c2024,.16,1.6,.2,-.95,.2,-1.2);add(0x1c2024,.16,1.6,.2,.95,.2,-1.2);add(0x2a2f35,3.2,.35,.6,0,.7,-1.2);
  const tilt=new THREE.Group();tilt.position.set(0,-.46,-.62);tilt.rotation.x=-.9;cockpit.add(tilt);tilt.add(wheelSpin);
  const wm=L(0x111111);wheelSpin.add(new THREE.Mesh(new THREE.TorusGeometry(.2,.025,8,20),wm));
  add(0x111111,.4,.03,.03,0,0,0,wheelSpin);add(0x111111,.03,.2,.03,0,-.1,0,wheelSpin);add(0x222222,.1,.1,.05,0,0,0,wheelSpin);
  // ハイブリッドメーター（アナログ速度計＋デジタル表示＋インジケーター）。描画は drawMeter()
  const gc=document.createElement('canvas');gc.width=512;gc.height=256;window.gctx=gc.getContext('2d');
  window.gtex=new THREE.CanvasTexture(gc);gtex.minFilter=THREE.LinearFilter;gtex.generateMipmaps=false;
  const mt=new THREE.Group();mt.position.set(0,-.25,-1.1);mt.rotation.x=-.9;cockpit.add(mt);
  const bz=new THREE.Mesh(new THREE.PlaneGeometry(.6,.32),new THREE.MeshBasicMaterial({color:0x0b0d10}));bz.position.z=-.004;mt.add(bz);
  mt.add(new THREE.Mesh(new THREE.PlaneGeometry(.56,.28),new THREE.MeshBasicMaterial({map:gtex})));
  // ワイパー
  [-.55,.15].forEach(x=>{const g=new THREE.Group();g.position.set(x,-.33,-1.3);const b=new THREE.Mesh(B,wm);b.scale.set(.8,.025,.03);b.position.x=.4;g.add(b);cockpit.add(g);wipers.push(g)});
  // サイドミラー（低頻度で後方を描画）
  [-1,1].forEach(s=>{
    const rt=new THREE.WebGLRenderTarget(128,176),cam=new THREE.PerspectiveCamera(38,128/176,.5,120);
    cam.position.set(s*1.55,2.1,-4.7);cam.rotation.y=Math.PI+s*.14;busG.add(cam);
    add(0x111111,.34,.46,.03,s*.78,.05,-1.16);
    const p=new THREE.Mesh(new THREE.PlaneGeometry(.3,.42),new THREE.MeshBasicMaterial({map:rt.texture,side:THREE.DoubleSide}));
    p.scale.x=-1;p.position.set(s*.78,.05,-1.14);cockpit.add(p);mirrors.push({rt,cam});
  });
})();
let mf=0;function renderMirrors(){
  const m=mirrors[mf++&1];cockpit.visible=false;scene.updateMatrixWorld();
  renderer.setRenderTarget(m.rt);renderer.render(scene,m.cam);renderer.setRenderTarget(null);cockpit.visible=true}

/* ===== バス物理 ===== */
const bus={x:67,z:350,yaw:0,v:0,steer:0,acc:0,brakeT:0,pitch:0,roll:0};
function hitAt(x,z,yaw){
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  for(const o of[-5,0,5]){const px=x+fx*o,pz=z+fz*o;
    if(px<-25||pz<-25||px>MAXC+25||pz>MAXC+25)return true;
    for(const b of obstacles)if(px>b[0]-1.3&&px<b[1]+1.3&&pz>b[2]-1.3&&pz<b[3]+1.3)return true;
    for(const c of cars){const dx=px-c.x,dz=pz-c.z;if(dx*dx+dz*dz<7.5)return true}}
  return false}
function stepBus(dt){
  const c=Controls,tg=c.right-c.left,rate=tg?1.7:2.8;
  bus.steer+=clamp(tg-bus.steer,-rate*dt,rate*dt);
  let a=0;
  if(c.brake){
    if(bus.v>.05){a=-4.8;bus.brakeT=0}
    else{bus.brakeT+=dt;if(bus.brakeT<.4)bus.v=0;else a=bus.v>-3?-1.3:0}
  }else{bus.brakeT=0;
    a=c.accel?(bus.v<0?3.5:1.7*(1-bus.v/17)+.05):-Math.sign(bus.v)*(.35+.02*Math.abs(bus.v))}
  let nv=bus.v+a*dt;
  if(bus.v>0&&nv<0&&!(c.brake&&bus.brakeT>.4))nv=0;
  if(bus.v<0&&nv>0&&!c.accel)nv=0;
  bus.v=nv;bus.acc+=(a-bus.acc)*Math.min(1,dt*5);
  const ang=bus.steer*.55/(1+Math.abs(bus.v)/9),py=bus.yaw;
  bus.yaw-=bus.v/5.5*Math.tan(ang)*dt; // 右(+)でyaw減少=右旋回
  const nx=bus.x-Math.sin(bus.yaw)*bus.v*dt,nz=bus.z-Math.cos(bus.yaw)*bus.v*dt;
  if(hitAt(nx,nz,bus.yaw)){bus.yaw=py;bus.v*=-.3;if(Math.abs(bus.v)<.4)bus.v=0}else{bus.x=nx;bus.z=nz}
}

/* ===== ハイブリッドメーター描画（状態オブジェクト m を受け取る純粋な描画関数） ===== */
const MC={bg:'#0b0d10',line:'#23282f',off:'#171b20',offTxt:'#4b5560',txt:'#eceff2',sub:'#9aa3ad',acc:'#ff6a2a',grn:'#3ddc84',blu:'#4aa8ff',amb:'#ffb020',red:'#ff3b30'};
const MF='"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif';
function drawMeter(g,m){
  const cx=170,cy=132,A0=.75*Math.PI,SW=1.5*Math.PI,ang=v=>A0+Math.min(Math.max(v,0),100)/100*SW;
  g.fillStyle=MC.bg;g.fillRect(0,0,512,256);g.strokeStyle=MC.line;g.lineWidth=3;g.strokeRect(2,2,508,252);
  // 速度弧（ベース＋現在速度）
  g.lineCap='butt';g.lineWidth=10;g.strokeStyle='#1c2128';g.beginPath();g.arc(cx,cy,104,A0,A0+SW);g.stroke();
  if(m.needle>.5){g.strokeStyle=MC.acc;g.beginPath();g.arc(cx,cy,104,A0,ang(m.needle));g.stroke()}
  // 目盛り 0〜100km/h（5刻み、10刻みで長線、20刻みで数字）
  g.textAlign='center';g.textBaseline='middle';
  for(let v=0;v<=100;v+=5){const a=ang(v),c=Math.cos(a),s=Math.sin(a),maj=v%10===0,r1=maj?78:87;
    g.lineWidth=maj?3:1.5;g.strokeStyle=MC.txt;g.beginPath();g.moveTo(cx+c*96,cy+s*96);g.lineTo(cx+c*r1,cy+s*r1);g.stroke();
    if(v%20===0){g.fillStyle=MC.txt;g.font='bold 20px Arial,sans-serif';g.fillText(String(v),cx+c*62,cy+s*62)}}
  // 針
  const na=ang(m.needle),nc=Math.cos(na),ns=Math.sin(na);
  g.lineCap='round';g.lineWidth=5;g.strokeStyle=MC.acc;g.beginPath();g.moveTo(cx-nc*14,cy-ns*14);g.lineTo(cx+nc*90,cy+ns*90);g.stroke();g.lineCap='butt';
  g.fillStyle='#1c2128';g.strokeStyle=MC.acc;g.lineWidth=3;g.beginPath();g.arc(cx,cy,9,0,Math.PI*2);g.fill();g.stroke();
  // デジタル速度（km/h・整数）
  g.fillStyle=MC.txt;g.font='bold 50px Arial,sans-serif';g.fillText(String(m.kmh),cx,205);
  g.fillStyle=MC.sub;g.font='bold 16px Arial,sans-serif';g.fillText('km/h',cx,235);
  // 右パネル
  g.strokeStyle=MC.line;g.lineWidth=2;g.beginPath();g.moveTo(302,16);g.lineTo(302,240);g.stroke();
  // ギア D / N / R
  ['D','N','R'].forEach((k,i)=>{const x=345+i*56,on=m.gear===k;
    g.fillStyle=on?(k==='R'?MC.amb:MC.txt):'#3a414a';g.font='bold 44px Arial,sans-serif';g.fillText(k,x,50);
    if(on){g.fillStyle=k==='R'?MC.amb:MC.grn;g.fillRect(x-18,76,36,4)}});
  // ウインカー・ライト
  const arrow=(x,d,on)=>{g.fillStyle=on?MC.grn:MC.off;g.beginPath();g.moveTo(x+d*22,125);g.lineTo(x+d*2,108);g.lineTo(x+d*2,118);g.lineTo(x-d*22,118);g.lineTo(x-d*22,132);g.lineTo(x+d*2,132);g.lineTo(x+d*2,142);g.closePath();g.fill()};
  const tag=(x,y,w,t,on,col,tc)=>{g.fillStyle=on?col:MC.off;g.fillRect(x-w/2,y-18,w,36);g.fillStyle=on?(tc||'#000'):MC.offTxt;g.font='bold 18px '+MF;g.fillText(t,x,y+1)};
  arrow(336,-1,m.left);arrow(466,1,m.right);tag(401,125,62,'ライト',m.light,MC.blu);
  tag(352,178,84,'前扉',m.doorF,MC.amb);tag(450,178,84,'中扉',m.doorM,MC.amb);
  // 警告（実条件のみ点灯）: ブレーキ＝走行中にブレーキ操作 / 注意＝走行中に扉が開いている
  tag(352,225,84,'ブレーキ',m.brake,MC.red,'#fff');tag(450,225,84,'注意',m.warn,MC.red,'#fff');
}
const mst={needle:0,kmh:0,gear:'N',left:false,right:false,light:false,doorF:false,doorM:false,brake:false,warn:false};
const mpv={needle:-1,kmh:-1,gear:'',left:null,right:null,light:null,doorF:null,doorM:null,brake:null,warn:null};
let dispSpd=0;

/* ===== 表示更新 ===== */
let T=0,lastKmh=-1,gT=0;
function updateVisuals(dt){
  busG.position.set(bus.x,0,bus.z);busG.rotation.y=bus.yaw;
  const sp=Math.abs(bus.v);
  bus.pitch+=(bus.acc*.006-bus.pitch)*Math.min(1,dt*6);
  bus.roll+=(bus.steer*sp*.0022-bus.roll)*Math.min(1,dt*5);
  const vib=sp>.3?Math.sin(T*38)*.004+Math.sin(T*23)*.003:Math.sin(T*30)*.0015;
  camera.position.set(DRV.x,DRV.y+vib,DRV.z);camera.rotation.set(-.03+bus.pitch,0,bus.roll);
  wheelSpin.rotation.z=-bus.steer*2.2;
  const on=Math.floor(T*1.5)%2===0;
  const wa=Sw.wiper?(Math.sin(T*5)+1)/2*1.3:0;wipers.forEach(w=>w.rotation.z=wa);
  const ph=Math.floor(T/12)%2;sigEW.color.setHex(ph?0xdd2222:0x22dd55);sigNS.color.setHex(ph?0x22dd55:0xdd2222);
  const kmh=Math.round(sp*3.6);
  if(kmh!==lastKmh){lastKmh=kmh;document.getElementById('spd').textContent=kmh;document.getElementById('gear').textContent=bus.v<-.1?'R':(sp<.1?'N':'D')}
  // メーター: 針は実速度(|v|)へ滑らかに追従、停止時は0へ戻る。変化があるときだけ再描画（最大約20Hz）
  dispSpd+=(sp*3.6-dispSpd)*Math.min(1,dt*8);if(Math.abs(sp*3.6-dispSpd)<.05)dispSpd=sp*3.6;
  mst.needle=Math.round(dispSpd*4)/4;mst.kmh=kmh;mst.gear=bus.v<-.1?'R':(sp<.1?'N':'D');
  mst.left=!!Sw.left&&on;mst.right=!!Sw.right&&on;mst.light=!!Sw.light;mst.doorF=!!Sw.doorF;mst.doorM=!!Sw.doorM;
  mst.brake=!!Controls.brake&&sp>.3;mst.warn=(!!Sw.doorF||!!Sw.doorM)&&sp>.8&&on;
  if((gT+=dt)>.05){let ch=false;for(const k in mst)if(mst[k]!==mpv[k]){mpv[k]=mst[k];ch=true}
    if(ch){gT=0;drawMeter(gctx,mst);gtex.needsUpdate=true}else gT=.05}
}

/* ===== メインループ ===== */
let running=false,last=0,fa=0,fc=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;T+=dt;
  if(running){stepBus(dt);updateCars(dt)}
  updateVisuals(dt);renderMirrors();renderer.render(scene,camera);
  fa+=dt;if(++fc>=90){const avg=fa/fc;fa=fc=0; // 負荷に応じて解像度を自動調整
    if(avg>.03&&PR>.75){PR-=.15;resize()}else if(avg<.018&&PR<PRmax){PR=Math.min(PRmax,PR+.1);resize()}}
}
resize();
document.getElementById('start').addEventListener('click',()=>{
  document.getElementById('title').style.display='none';document.getElementById('hud').hidden=false;running=true});
requestAnimationFrame(loop);
</script>
</body></html>
